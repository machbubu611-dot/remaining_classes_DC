<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>會員剩餘課程整理表 - 康博診所</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --teal:#0f9e8c;
    --teal-dark:#085041;
    --teal-light:#e1f5ee;
    --gray-900:#2c2c2a;
    --gray-700:#444441;
    --gray-500:#888780;
    --gray-300:#d3d1c7;
    --gray-100:#f1efe8;
    --white:#ffffff;
    --danger:#c0392b;
    --radius:10px;
    --border:#e4e2d9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--gray-100);
    color:var(--gray-900);
    line-height:1.6;
  }
  .wrap{max-width:980px;margin:0 auto;padding:24px 20px 80px;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;
    background:var(--white);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 20px;margin-bottom:20px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand img{height:36px;display:block;}
  .brand .title{font-size:14px;color:var(--gray-500);}
  .btns{display:flex;gap:8px;flex-wrap:wrap;}
  button{
    font-family:inherit;font-size:13px;color:var(--gray-900);
    background:var(--white);border:1px solid var(--gray-300);border-radius:8px;
    padding:8px 14px;cursor:pointer;transition:background .15s;
  }
  button:hover{background:var(--gray-100);}
  button.primary{background:var(--teal);border-color:var(--teal);color:var(--white);}
  button.primary:hover{background:var(--teal-dark);}
  button.danger{color:var(--danger);border-color:var(--danger);}
  button.small{font-size:12px;padding:4px 10px;}
  input[type=text],input[type=password],input[type=number]{
    font-family:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--gray-300);
    border-radius:6px;color:var(--gray-900);background:var(--white);
  }
  #fileInput{display:none;}
  .customer-card{
    background:var(--white);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 20px;margin-bottom:24px;display:flex;gap:36px;flex-wrap:wrap;
  }
  .customer-card .field .label{font-size:12px;color:var(--gray-500);margin-bottom:2px;}
  .customer-card .field .value{font-size:16px;font-weight:600;}
  .empty-state{
    text-align:center;padding:80px 20px;color:var(--gray-500);
    background:var(--white);border:1px dashed var(--gray-300);border-radius:var(--radius);
  }
  .empty-state .big{font-size:16px;color:var(--gray-700);margin-bottom:8px;}
  .branch-block{margin-bottom:32px;}
  .branch-title{
    display:flex;align-items:center;gap:10px;margin-bottom:14px;
  }
  .branch-title .bar{width:6px;height:20px;background:var(--teal);border-radius:3px;}
  .branch-title .name{font-size:17px;font-weight:600;}
  .branch-title .codes{font-size:12px;color:var(--gray-500);}
  .sub-section{margin-left:16px;margin-bottom:20px;}
  .sub-title{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .sub-title .label{font-size:14px;font-weight:600;}
  .sub-title .count{font-size:11px;color:var(--gray-500);background:var(--gray-100);border-radius:6px;padding:1px 8px;}
  table{width:100%;border-collapse:collapse;font-size:13px;background:var(--white);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  table th{
    text-align:left;font-weight:600;color:var(--gray-500);background:var(--gray-100);
    padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap;
  }
  table th.sortable:hover{color:var(--teal-dark);}
  table th .arrow{font-size:10px;margin-left:2px;opacity:.6;}
  table td{padding:8px 10px;border-bottom:1px solid var(--border);}
  table tr:last-child td{border-bottom:none;}
  td.num{text-align:right;font-variant-numeric:tabular-nums;}
  th.num{text-align:right;}
  .cat-cards{display:flex;flex-direction:column;gap:10px;}
  .cat-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:12px 16px;break-inside:avoid;}
  .cat-card-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .cat-card-head .cname{font-size:14px;font-weight:600;}
  .cat-card-head .total{font-size:13px;color:var(--teal-dark);font-weight:600;}
  table.cat-table{border:none;border-radius:0;margin-top:2px;}
  table.cat-table th{background:transparent;padding:4px 6px;font-size:11px;color:var(--gray-500);border-bottom:1px solid var(--border);cursor:default;}
  table.cat-table td{padding:5px 6px;font-size:13px;border-bottom:1px dashed var(--border);color:var(--gray-700);}
  table.cat-table tr:last-child td{border-bottom:none;}
  .warn-icon{vertical-align:-2px;margin-right:3px;}
  .muted-code{color:var(--gray-500);}
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--gray-900);color:var(--white);padding:10px 20px;border-radius:8px;
    font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:100;
  }
  .toast.show{opacity:1;}
  .modal-overlay{
    position:fixed;inset:0;background:rgba(44,44,42,.45);display:flex;
    align-items:flex-start;justify-content:center;overflow-y:auto;z-index:50;padding:40px 16px;
  }
  .modal{
    background:var(--white);border-radius:var(--radius);padding:24px;width:100%;max-width:640px;
    max-height:calc(100vh - 80px);overflow-y:auto;
  }
  .modal h3{margin:0 0 16px;font-size:16px;}
  .modal .row{display:flex;gap:8px;margin-bottom:10px;align-items:center;}
  .modal .close-row{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;position:sticky;bottom:0;background:var(--white);padding-top:12px;}
  .edit-cat{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:10px;}
  .edit-cat-head{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .edit-cat-head input[type=text]{flex:1;font-weight:600;}
  .edit-item-row{display:flex;gap:6px;align-items:center;font-size:12px;padding:3px 0;color:var(--gray-700);}
  .edit-item-row .code{width:80px;color:var(--gray-500);font-variant-numeric:tabular-nums;}
  .edit-item-row .name{flex:1;}
  .add-item-row{display:flex;gap:6px;margin-top:6px;}
  .add-item-row input{font-size:12px;padding:4px 8px;}
  .add-item-row input.code-input{width:90px;}
  .hint{font-size:12px;color:var(--gray-500);margin-top:4px;}
  @page{ margin:14mm 12mm; }
  @media print{
    body{background:var(--white);}
    .no-print{display:none !important;}
    .wrap{max-width:100%;padding:0;}
    .cat-card{border:1px solid #ccc;break-inside:avoid;}
    table{border:1px solid #ccc;border-radius:0;}
    thead{display:table-header-group;}
    tr{break-inside:avoid;}
    .branch-title,.sub-title{break-after:avoid-page;}
    .customer-card{break-inside:avoid;}
  }
</style>
</head>

/* ---------- parsing ---------- */
function normHeader(s){ return String(s==null?'':s).replace(/\s+/g,'').trim(); }
function excelSerialToDate(serial){
  const ms = Math.round((serial - 25569) * 86400 * 1000);
  return new Date(ms);
}
function fmtDate(d){
  return d.getUTCFullYear() + '/' + String(d.getUTCMonth()+1).padStart(2,'0') + '/' + String(d.getUTCDate()).padStart(2,'0');
}
function normCode(v){
  if (v == null) return '';
  let s = String(v).trim();
  if (/^\d+$/.test(s)) s = s.padStart(7,'0');
  return s;
}
const FIELD_MAP = {
  '客戶姓名':'name', '系統客代':'custCode', '電話':'phone', '銷售分店':'branch',
  '商品碼':'productCode', '療程名稱':'productName', '購買日期':'purchaseDate',
  '使用期限':'expiry', '剩餘堂數':'sessions', '目前剩餘點數':'points'
};
function parseResidualFile(buf){
  const wb = XLSX.read(buf, {type:'array'});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
  let headerRowIdx = -1, colMap = {};
  for (let r=0; r<Math.min(rows.length,15); r++){
    const row = rows[r];
    for (let c=0;c<row.length;c++){
      if (normHeader(row[c]) === '商品碼'){ headerRowIdx = r; break; }
    }
    if (headerRowIdx>=0) break;

  headerRow.forEach((cell,idx)=>{
    const key = FIELD_MAP[normHeader(cell)];
    if (key && !(key in colMap)) colMap[key] = idx;
  });
  const required = ['name','custCode','branch','productCode','productName','purchaseDate','expiry','sessions','points'];
  const missing = required.filter(k=>!(k in colMap));
  if (missing.length) throw new Error('檔案缺少欄位: '+missing.join('、'));

  const items = [];
  let customer = null;
  for (let r=headerRowIdx+1; r<rows.length; r++){
    const row = rows[r];
    const nameVal = row[colMap.name];
    if (nameVal === '' || nameVal == null) break;
    if (!customer){
      customer = {
        name: String(nameVal).trim(),
        custCode: String(row[colMap.custCode]).trim(),
        phone: String(row[colMap.phone]).trim()
      };
    }
    const productName = String(row[colMap.productName]||'').trim();
    if (productName.includes('開卡')) continue;
    const sessions = Number(row[colMap.sessions])||0;
    const points = Number(row[colMap.points])||0;
    let qty, unit;
    if (sessions > 0){ qty = sessions; unit = '堂'; } else { qty = points; unit = '點'; }
    let purchaseDate = row[colMap.purchaseDate];
    if (typeof purchaseDate === 'number'){ purchaseDate = fmtDate(excelSerialToDate(purchaseDate)); }
    else { purchaseDate = String(purchaseDate||'').trim(); }
    const expiry = String(row[colMap.expiry]||'').trim();
    items.push({
      productCode: normCode(row[colMap.productCode]),
      productName, purchaseDate, expiry, qty, unit,
      branch: String(row[colMap.branch]||'').trim()
    });
  }
  if (!customer) throw new Error('沒有讀到任何會員資料，請確認檔案內容');
  return {customer, items};
}

function handleFileUpload(evt){
  const file = evt.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const buf = new Uint8Array(e.target.result);
      parsed = parseResidualFile(buf);
      sortState = {};
      render();
      toast('已匯入 ' + parsed.customer.name + ' 的殘值資料');
    }catch(err){
      toast('匯入失敗：' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
  evt.target.value = '';
}

/* ---------- matching / grouping ---------- */
function buildCodeIndex(){
  const map = {};
  db.forEach(cat=>{
    cat.items.forEach(it=>{ map[normCode(it.code)] = {category: cat.category, brand: cat.brand || ''}; });
  });
  return map;
}
function branchPrefix(code){
  const m = String(code||'').match(/^[A-Za-z]+/);
  return m ? m[0].toUpperCase() : (code || '未分類分店');
}
const BRAND_MAP = {'D':'康博', 'M':'美加', 'HQ':'總部'};
function brandName(prefix){ return BRAND_MAP[prefix] || prefix; }
function orderPrefixes(prefixes){
  const preferred = ['D','M','HQ'];
  const rest = prefixes.filter(p=>!preferred.includes(p)).sort();
  return preferred.filter(p=>prefixes.includes(p)).concat(rest);
}
function expirySortValue(expiry){
  if (!expiry || expiry.includes('不限期')) return Infinity;
  const t = Date.parse(expiry.replace(/\//g,'-'));
  return isNaN(t) ? Infinity : t;
}
function dateSortValue(dateStr){
  const t = Date.parse(String(dateStr).replace(/\//g,'-'));
  return isNaN(t) ? 0 : t;
}
function defaultCompare(a,b){
  if (a.productName !== b.productName) return a.productName < b.productName ? -1 : 1;
  return a.productCode < b.productCode ? -1 : (a.productCode > b.productCode ? 1 : 0);
}
function isExpiringSoon(expiry){
  if (!expiry || expiry.includes('不限期')) return false;
  const t = Date.parse(String(expiry).replace(/\//g,'-'));
  if (isNaN(t)) return false;
  const threshold = new Date();
  threshold.setMonth(threshold.getMonth()+3);
  return t <= threshold.getTime();
}
function warnIcon(){
  return '<svg class="warn-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 L22 20 L2 20 Z"></path><line x1="12" y1="9" x2="12" y2="14"></line><circle cx="12" cy="17.3" r="0.9" fill="#c0392b" stroke="none"></circle></svg>';
}
function expiryCell(expiry){
  return (isExpiringSoon(expiry) ? warnIcon() : '') + esc(expiry);
}

/* ---------- rendering ---------- */
function render(){
  const root = document.getElementById('content');
  if (!parsed){
    root.innerHTML = '<div class="empty-state"><div class="big">尚未匯入會員殘值統計表</div><div>請點上方「匯入殘值表」，選擇清單檢視格式的 .xls 檔案</div></div>';
    return;
  }
  const codeIndex = buildCodeIndex();
  const byBranch = {};
  parsed.items.forEach(it=>{
    const match = codeIndex[it.productCode];
    const bucket = (match && match.brand) ? match.brand : branchPrefix(it.branch);
    (byBranch[bucket] = byBranch[bucket] || []).push(it);
  });
  const order = orderPrefixes(Object.keys(byBranch));

  let html = '';
  html += '<div class="customer-card">';
  html += field('客戶姓名', parsed.customer.name);
  html += field('系統客代', parsed.customer.custCode);
  html += field('客戶電話', parsed.customer.phone);
  html += '</div>';

  order.forEach(prefix=>{
    const items = byBranch[prefix];
    const branchCodes = [...new Set(items.map(i=>i.branch))].sort().join(' · ');
    const unmatched = items.filter(i=>!codeIndex[i.productCode]);
    const matchedByCat = {};
    items.forEach(i=>{
      const match = codeIndex[i.productCode];
      if (match) (matchedByCat[match.category] = matchedByCat[match.category] || []).push(i);
    });

    html += '<div class="branch-block">';
    html += '<div class="branch-title"><div class="bar"></div><div class="name">銷售品牌 ' + esc(brandName(prefix)) + '</div><div class="codes">' + branchCodes + '</div></div>';

    const sortKey = prefix + '_unmatched';
    if (!sortState[sortKey]) sortState[sortKey] = {col:'default', dir:'asc'};
    const sst = sortState[sortKey];
    const sortedUnmatched = [...unmatched].sort((a,b)=>{
      if (sst.col==='purchaseDate' || sst.col==='expiry'){
        const va = sst.col==='expiry' ? expirySortValue(a.expiry) : dateSortValue(a.purchaseDate);
        const vb = sst.col==='expiry' ? expirySortValue(b.expiry) : dateSortValue(b.purchaseDate);
        return sst.dir==='asc' ? va-vb : vb-va;
      }
      return defaultCompare(a,b);
    });

    html += '<div class="sub-section">';
    html += '<div class="sub-title"><div class="label">未歸類療程</div><div class="count">' + unmatched.length + ' 筆</div></div>';
    if (sortedUnmatched.length){
      html += '<table><thead><tr>';
      html += '<th style="width:14%">療程代碼</th>';
      html += '<th>療程名稱</th>';
      html += th('購買日期','purchaseDate',sortKey,'14%');
      html += th('使用期限','expiry',sortKey,'14%');
      html += '<th class="num" style="width:10%">剩餘數量</th>';
      html += '</tr></thead><tbody>';
      sortedUnmatched.forEach(it=>{
        html += '<tr><td class="muted-code">' + esc(it.productCode) + '</td><td>' + esc(it.productName) + '</td><td>' + esc(it.purchaseDate) + '</td><td>' + expiryCell(it.expiry) + '</td><td class="num">' + it.qty + ' ' + it.unit + '</td></tr>';
      });
      html += '</tbody></table>';
    } else {
      html += '<div class="hint">此區塊沒有未歸類的療程</div>';
    }
    html += '</div>';

    html += '<div class="sub-section">';
    html += '<div class="sub-title"><div class="label">已歸類療程</div></div>';
    const catNames = db.map(c=>c.category).filter(name=>matchedByCat[name] && matchedByCat[name].length);
    if (catNames.length){
      html += '<div class="cat-cards">';
      catNames.forEach(cat=>{
        const catSortKey = prefix + '_cat_' + cat;
        if (!sortState[catSortKey]) sortState[catSortKey] = {col:'expiry', dir:'asc'};
        const csst = sortState[catSortKey];
        const rows = [...matchedByCat[cat]].sort((a,b)=>{
          const va = csst.col==='purchaseDate' ? dateSortValue(a.purchaseDate) : expirySortValue(a.expiry);
          const vb = csst.col==='purchaseDate' ? dateSortValue(b.purchaseDate) : expirySortValue(b.expiry);
          return csst.dir==='asc' ? va-vb : vb-va;
        });
        const totals = {};
        rows.forEach(r=>{ totals[r.unit] = (totals[r.unit]||0) + r.qty; });
        const totalStr = Object.keys(totals).map(u=>totals[u]+' '+u).join(' · ');
        html += '<div class="cat-card"><div class="cat-card-head"><div class="cname">' + esc(cat) + '</div><div class="total">合計 ' + totalStr + '</div></div>';
        html += '<table class="cat-table"><thead><tr>' + th('購買日期','purchaseDate',catSortKey,'40%') + th('使用期限','expiry',catSortKey,'40%') + '<th class="num" style="width:20%">剩餘數量</th></tr></thead><tbody>';
        rows.forEach(r=>{
          html += '<tr><td>' + esc(r.purchaseDate) + '</td><td>' + expiryCell(r.expiry) + '</td><td class="num">' + r.qty + ' ' + r.unit + '</td></tr>';
        });
        html += '</tbody></table>';
        html += '</div>';
      });
      html += '</div>';
    } else {
      html += '<div class="hint">此區塊沒有已歸類的療程</div>';
    }
    html += '</div>';

    html += '</div>';
  });

  root.innerHTML = html;
}
function field(label, value){
  return '<div class="field"><div class="label">' + esc(label) + '</div><div class="value">' + esc(value||'-') + '</div></div>';
}
function th(label, col, sortKey, width){
  const sst = sortState[sortKey] || {col:'purchaseDate', dir:'asc'};
  const arrow = sst.col===col ? (sst.dir==='asc' ? '&#9650;' : '&#9660;') : '';
  return '<th class="sortable" style="width:' + width + '" onclick="toggleSort(\'' + sortKey + '\',\'' + col + '\')">' + esc(label) + ' <span class="arrow">' + arrow + '</span></th>';
}
function toggleSort(sortKey, col){
  const sst = sortState[sortKey] || {col:'purchaseDate', dir:'asc'};
  if (sst.col === col){ sst.dir = sst.dir==='asc' ? 'desc' : 'asc'; }
  else { sst.col = col; sst.dir = 'asc'; }
  sortState[sortKey] = sst;
  render();
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------- edit database panel ---------- */
function openEditGate(){
  if (editUnlocked){ openEditPanel(); return; }
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay no-print';
  overlay.innerHTML = '<div class="modal" style="max-width:360px;">' +
    '<h3>輸入密碼以編輯對照資料庫</h3>' +
    '<div class="row"><input type="password" id="gatePw" placeholder="請輸入密碼" style="flex:1;"></div>' +
    '<div id="gateErr" style="color:var(--danger);font-size:12px;display:none;">密碼錯誤</div>' +
    '<div class="close-row"><button onclick="closeModal()">取消</button><button class="primary" onclick="checkGate()">確認</button></div>' +
    '</div>';
  document.getElementById('modalRoot').appendChild(overlay);
  document.getElementById('gatePw').focus();
  document.getElementById('gatePw').addEventListener('keydown', e=>{ if(e.key==='Enter') checkGate(); });
}
function checkGate(){
  const val = document.getElementById('gatePw').value;
  if (val === EDIT_PASSWORD){
    editUnlocked = true;
    closeModal();
    openEditPanel();
  } else {
    document.getElementById('gateErr').style.display = 'block';
  }
}
function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
}
function openEditPanel(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay no-print';
  overlay.innerHTML = '<div class="modal" id="editModal"></div>';
  document.getElementById('modalRoot').appendChild(overlay);
  renderEditPanel();
}
function renderEditPanel(){
  const m = document.getElementById('editModal');
  if (!m) return;
  let html = '<h3>編輯常贈送療程對照資料庫</h3>';
  html += '<div class="hint" style="margin-bottom:10px;">用 &#9650;&#9660; 調整分類順序，會員報表上「已歸類療程」也會依這個順序顯示。每個分類可指定「歸屬品牌」，指定後該分類品項會固定顯示在該品牌區塊，不受實際銷售分店影響。</div>';
  html += '<div class="row"><button class="small" onclick="toggleEditCollapse()">' + (editItemsExpanded ? '收合全部品項' : '展開全部品項') + '</button></div>';
  db.forEach((cat, ci)=>{
    html += '<div class="edit-cat">';
    html += '<div class="edit-cat-head">' +
      '<button class="small" onclick="moveCategory(' + ci + ',-1)" ' + (ci===0?'disabled':'') + ' title="上移">&#9650;</button>' +
      '<button class="small" onclick="moveCategory(' + ci + ',1)" ' + (ci===db.length-1?'disabled':'') + ' title="下移">&#9660;</button>' +
      '<input type="text" value="' + escAttr(cat.category) + '" onchange="renameCategory(' + ci + ', this.value)">' +
      brandSelect(ci, cat.brand) +
      (editItemsExpanded ? '' : '<span class="hint" style="margin:0 4px;white-space:nowrap;">' + cat.items.length + ' 項</span>') +
      '<button class="small danger" onclick="removeCategory(' + ci + ')">刪除分類</button></div>';
    if (editItemsExpanded){
      cat.items.forEach((it, ii)=>{
        html += '<div class="edit-item-row"><span class="code">' + esc(it.code) + '</span><span class="name">' + esc(it.name) + '</span><button class="small" onclick="removeItem(' + ci + ',' + ii + ')">移除</button></div>';
      });
      html += '<div class="add-item-row">' +
        '<input class="code-input" type="text" placeholder="商品碼(7碼)" id="newCode_' + ci + '">' +
        '<input style="flex:1" type="text" placeholder="商品名稱" id="newName_' + ci + '">' +
        '<button class="small" onclick="addItem(' + ci + ')">新增品項</button>' +
        '</div>';
    }
    html += '</div>';
  });
  html += '<div class="row"><input type="text" id="newCatName" placeholder="新分類名稱" style="flex:1;"><button onclick="addCategory()">新增分類</button></div>';
  html += '<div class="close-row" style="justify-content:space-between;">';
  html += '<div><button class="small" onclick="exportDB()">匯出 Excel 備份</button> <button class="small" onclick="document.getElementById(\'importDBInput\').click()">匯入 Excel</button><input type="file" id="importDBInput" accept=".xlsx,.xls" style="display:none" onchange="importDB(event)"> <button class="small danger" onclick="restoreDefault()">還原預設資料庫</button></div>';
  html += '<button class="primary" onclick="closeModal(); render();">完成</button>';
  html += '</div>';
  m.innerHTML = html;
}
function brandSelect(ci, brand){
  const opts = [['','不指定(依銷售分店)']].concat(Object.keys(BRAND_MAP).map(k=>[k, BRAND_MAP[k]]));
  let s = '<select onchange="setCategoryBrand(' + ci + ', this.value)" style="font-size:12px;padding:4px 6px;border:1px solid var(--gray-300);border-radius:6px;">';
  opts.forEach(o=>{
    s += '<option value="' + o[0] + '"' + (brand===o[0] || (!brand && !o[0]) ? ' selected' : '') + '>' + esc(o[1]) + '</option>';
  });
  s += '</select>';
  return s;
}
function setCategoryBrand(ci, val){ db[ci].brand = val; saveDB(); }
function toggleEditCollapse(){ editItemsExpanded = !editItemsExpanded; renderEditPanel(); }
function escAttr(s){ return esc(s).replace(/"/g,'&quot;'); }
function renameCategory(ci, val){ db[ci].category = val; saveDB(); }
function moveCategory(ci, dir){
  const target = ci + dir;
  if (target < 0 || target >= db.length) return;
  const tmp = db[ci]; db[ci] = db[target]; db[target] = tmp;
  saveDB();
  renderEditPanel();
}
function removeCategory(ci){ if(!confirm('確定要刪除這個分類嗎？')) return; db.splice(ci,1); saveDB(); renderEditPanel(); }
function removeItem(ci, ii){ db[ci].items.splice(ii,1); saveDB(); renderEditPanel(); }
function addItem(ci){
  const codeEl = document.getElementById('newCode_' + ci);
  const nameEl = document.getElementById('newName_' + ci);
  const code = normCode(codeEl.value.trim());
  const name = nameEl.value.trim();
  if (!code || !name){ toast('請輸入商品碼與名稱'); return; }
  db[ci].items.push({code, name});
  saveDB();
  renderEditPanel();
}
function addCategory(){
  const el = document.getElementById('newCatName');
  const name = el.value.trim();
  if (!name){ toast('請輸入分類名稱'); return; }
  db.push({category:name, items:[]});
  saveDB();
  renderEditPanel();
}
function sanitizeSheetName(name, used){
  let s = String(name||'分類').replace(/[:\\\/\?\*\[\]]/g, '').trim();
  if (!s) s = '分類';
  if (s.length > 31) s = s.slice(0,31);
  let base = s, i = 1;
  while (used.has(s)){
    const suffix = '_' + (++i);
    s = base.slice(0, 31-suffix.length) + suffix;
  }
  used.add(s);
  return s;
}
const BRAND_SHEET_NAME = '分類品牌設定';
function exportDB(){
  const wb = XLSX.utils.book_new();
  const used = new Set();
  db.forEach(cat=>{
    const rows = [['商品碼','商品名稱']];
    cat.items.forEach(it=>{ rows.push([it.code, it.name]); });
    const ws = XLSX.utils.aoa_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, sanitizeSheetName(cat.category, used));
  });
  const brandRows = [['分類','歸屬品牌代碼','歸屬品牌名稱']];
  db.forEach(cat=>{ brandRows.push([cat.category, cat.brand||'', cat.brand ? (BRAND_MAP[cat.brand]||cat.brand) : '不指定']); });
  const brandWs = XLSX.utils.aoa_to_sheet(brandRows);
  XLSX.utils.book_append_sheet(wb, brandWs, BRAND_SHEET_NAME);
  const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  const blob = new Blob([wbout], {type:'application/octet-stream'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '常贈送療程對照資料庫_' + new Date().toISOString().slice(0,10) + '.xlsx';
  a.click();
}
function importDB(evt){
  const file = evt.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const buf = new Uint8Array(e.target.result);
      const wb = XLSX.read(buf, {type:'array'});
      if (!wb.SheetNames.length) throw new Error('檔案內沒有任何分頁');
      const brandMap = {};
      if (wb.SheetNames.includes(BRAND_SHEET_NAME)){
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[BRAND_SHEET_NAME], {header:1, raw:true, defval:''});
        rows.slice(1).forEach(row=>{
          const cname = String(row[0]||'').trim();
          const bcode = String(row[1]||'').trim();
          if (cname) brandMap[cname] = bcode;
        });
      }
      const newDb = wb.SheetNames.filter(sn=>sn!==BRAND_SHEET_NAME).map(sn=>{
        const ws = wb.Sheets[sn];
        const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
        const items = [];
        rows.slice(1).forEach(row=>{
          const code = normCode(row[0]);
          const name = String(row[1]||'').trim();
          if (code && name) items.push({code, name});
        });
        return {category: sn, items, brand: brandMap[sn] || ''};
      });
      db = newDb;
      saveDB();
      renderEditPanel();
      toast('已匯入對照資料庫');
    }catch(err){ toast('匯入失敗：' + err.message); }
  };
  reader.readAsArrayBuffer(file);
  evt.target.value = '';
}
function restoreDefault(){
  if (!confirm('確定要還原成內建預設資料庫嗎？目前的編輯內容會被覆蓋。')) return;
  db = JSON.parse(JSON.stringify(DEFAULT_DB));
  saveDB();
  renderEditPanel();
}

render();
</script>
